[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfactory"
version = "0.1.0"
description = "A lightweight machine learning fine-tuning framework for scikit-learn models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ziyuan Huang" },
]
dependencies = [
  "scikit-learn>=1.9.1",
  "optuna>=5.0.0",
  "xgboost>=3.4.1",
  "seedhash>=0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
include = ["mlfactory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
