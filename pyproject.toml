[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfactory"
version = "0.1.0"
description = "A lightweight machine learning fine-tuning framework for scikit-learn models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ziyuan Huang" },
]
dependencies = [
  # Floors are the oldest versions the test suite passes on (Python 3.10);
  # the previous pins (scikit-learn 1.9.1 / xgboost 3.4.1) silently required 3.12.
  "scikit-learn>=1.5",
  "optuna>=3.6",
  "xgboost>=2.1",
  "seedhash>=0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
include = ["mlfactory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
